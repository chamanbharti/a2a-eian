[build-system]
requires = ["setuptools>=83,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-eian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx2>=2.13.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "build>=1.2,<2",
    "pip-audit>=2.7,<3",
    "setuptools>=83,<90"
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend/src"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["eian"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
